<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pikids English</title><style>* { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, sans-serif; } body { background: #e0f7fa; margin: 0; padding: 20px; text-align: center; } h1 { color: #ff4081; font-size: 2.5rem; margin-bottom: 5px; } p { color: #00796b; font-size: 1.2rem; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; max-width: 600px; margin: 20px auto; } .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; border: 3px solid #ffd54f; } .card:hover { transform: scale(1.05); } .card span { font-size: 2.5rem; display: block; } .card p { margin: 10px 0 0; color: #333; font-weight: bold; }</style></head><body><h1>🎈 Pikids English 🎈</h1><p>Click on any item to hear its name!</p><div class="grid"><div class="card" onclick="speak('Apple')"><span>🍎</span><p>Apple</p></div><div class="card" onclick="speak('Cat')"><span>🐱</span><p>Cat</p></div><div class="card" onclick="speak('Dog')"><span>🐶</span><p>Dog</p></div><div class="card" onclick="speak('Sun')"><span>☀️</span><p>Sun</p></div><div class="card" onclick="speak('Car')"><span>🚗</span><p>Car</p></div><div class="card" onclick="speak('Star')"><span>⭐</span><p>Star</p></div></div><script>function speak(text) { const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'en-US'; utterance.rate = 0.8; speechSynthesis.speak(utterance); }</script></body></html>
